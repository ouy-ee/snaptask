# nginx 部署示例:HTTPS 反代 + 前端静态资源 + CSP 安全头
# 放在 /etc/nginx/sites-available/snaptask.conf,证书用 certbot 申请:
#   sudo certbot --nginx -d snaptask.example.com

server {
    listen 80;
    server_name snaptask.example.com;
    # certbot 会自动补上 443 段;首次运行前可先只配 80

    client_max_body_size 12m;

    # 前端构建产物(在仓库根目录 npm run build 后得到 dist/)
    root /var/www/snaptask/dist;
    index index.html;

    # 静态资源缓存(带 hash 的 assets)
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API 反代
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;   # 上传/分析任务
        proxy_request_buffering off;
    }

    # SPA 前端路由回退
    location / {
        try_files $uri $uri/ /index.html;
        # 安全头:仅允许自身资源(样式允许内联以兼容现有设计系统)
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }
}
